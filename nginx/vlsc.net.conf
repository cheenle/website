# VLSC Projects — nginx server block for www.vlsc.net
# Deploy to: /etc/nginx/sites-available/vlsc.net
# Then: sudo ln -sf /etc/nginx/sites-available/vlsc.net /etc/nginx/sites-enabled/vlsc.net

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    server_name www.vlsc.net vlsc.net;

    location /.well-known/acme-challenge/ {
        root /var/www/vlsc.net;
    }

    return 301 https://$host$request_uri;
}

# ── HTTPS main server ──
server {
    listen 443 ssl;
    http2 on;
    server_name www.vlsc.net vlsc.net;

    # SSL — Let's Encrypt via certbot
    ssl_certificate     /etc/letsencrypt/live/www.vlsc.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.vlsc.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── DocumentRoot ──
    root /var/www/vlsc.net;
    index index.html;

    # ── Performance ──
    sendfile on;
    tcp_nopush on;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── FDE → Agentic Engineering: canonical URL migrations (2026-09-02) ──
    # 整页改名，无路径变形，故用 location =（精确匹配）而非 rewrite。
    # 位置不敏感：nginx 先匹配 location =，再按「最长前缀 vs 正则」择优，
    # 精确匹配恒胜正则，下面的 location ~* \.html$ 抢不走这些请求。
    # 真正load-bearing的是发布顺序：内容站点先部署、本配置最后 reload，
    # 否则 301 会先指向还不存在的 /agentic.html，把老链接打成 404。
    location = /fde.html              { return 301 /agentic.html; }
    location = /zh/fde.html           { return 301 /zh/agentic.html; }
    location = /mrrc/fde.html         { return 301 /mrrc/agentic.html; }
    location = /mrrc/zh/fde.html      { return 301 /mrrc/zh/agentic.html; }
    location = /mrrc_modern/fde.html  { return 301 /mrrc_modern/agentic.html; }
    location = /mrrc_ft710/fde.html   { return 301 /mrrc_ft710/agentic.html; }

    # ── Static asset caching (all sub-sites) ──
    location ~* ^/(mrrc|mrrc_modern|mrrc_ft710|mrrc_ft8|sunmrrc|sunsdrmobile|efhw)/.*\.(css|js|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── HTML pages: always revalidate (never serve stale content) ──
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Landing page (root /) ──
    location / {
        try_files $uri $uri/ =404;
    }

    # ── MRRC website (/mrrc/) ──
    location /mrrc/ {
        try_files $uri $uri/ =404;
        autoindex off;
    }
    location = /mrrc {
        return 301 /mrrc/;
    }

    # ── MRRC Modern website (/mrrc_modern/) ──
    location /mrrc_modern/ {
        try_files $uri $uri/ =404;
        autoindex off;
    }
    location = /mrrc_modern {
        return 301 /mrrc_modern/;
    }

    # ── MRRC FT-710 website (/mrrc_ft710/) ──
    location /mrrc_ft710/ {
        try_files $uri $uri/ =404;
        autoindex off;
    }

    # ── MRRC-FT8 website (/mrrc_ft8/) ──
    location /mrrc_ft8/ {
        try_files $uri $uri/ =404;
        autoindex off;
    }
    location = /mrrc_ft8 {
        return 301 /mrrc_ft8/;
    }

    # ── SunMRRC website (/sunmrrc/) ──
    location /sunmrrc/ {
        try_files $uri $uri/ =404;
        autoindex off;
    }

    # ── SunsdrMobile website (/sunsdrmobile/) ──
    location /sunsdrmobile/ {
        try_files $uri $uri/ =404;
        autoindex off;
    }

    # ── EFHW website (/efhw/) ──
    location /efhw/ {
        try_files $uri $uri/ =404;
        autoindex off;
    }
    location = /efhw {
        return 301 /efhw/;
    }

    # ── Stats dashboard ──
    location = /stats { return 301 /stats/; }
    location /stats/ {
        alias /home/cheenle/stats/;
        index index.html;
        # NOTE: never add `try_files` here. alias + try_files is broken —
        # try_files resolves against the server root (/var/www/vlsc.net),
        # NOT the alias, so it returns 404 for /stats/index.html even though
        # the file exists (that is a real deployed failure, 2026-09-05).
        auth_basic "Stats Dashboard";
        auth_basic_user_file /home/cheenle/stats/.htpasswd;
    }

    # ── Feedback system (Python service @ 127.0.0.1:8021) ──
    location /feedback/static/ {
        alias /home/cheenle/feedback/static/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location /feedback/api/ {
        proxy_pass http://127.0.0.1:8021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /feedback/admin/ {
        proxy_pass http://127.0.0.1:8021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        auth_basic "Feedback Admin";
        auth_basic_user_file /home/cheenle/stats/.htpasswd;
    }

    # ── Deny hidden files ──
    location ~ /\. {
        deny all;
    }
}
