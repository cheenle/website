# Full access-log format for the main site: $host prefix so the stats analyzer
# (/opt/vlsc-stats/analyze_nginx.py) can break traffic down per domain/vhost.
log_format vlsc_full '$host $remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
