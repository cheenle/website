# VLSC Projects — nginx server block for www.vlsc.net
# Deploy to: /etc/nginx/sites-available/vlsc.net
# Then: sudo ln -sf /etc/nginx/sites-available/vlsc.net /etc/nginx/sites-enabled/vlsc.net

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    server_name www.vlsc.net vlsc.net;

    location /.well-known/acme-challenge/ {
        root /var/www/vlsc.net;
    }

    return 301 https://$host$request_uri;
}

# ── HTTPS main server ──
server {
    listen 443 ssl;
    http2 on;
    server_name www.vlsc.net vlsc.net;

    # SSL — Let's Encrypt via certbot
    ssl_certificate     /etc/letsencrypt/live/www.vlsc.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.vlsc.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── DocumentRoot ──
    root /var/www/vlsc.net;

    # ── MRRC 支持包接收端（/opt/mrrc-support + systemd support-receiver）──
    # ^~ 保证不被下面的正则 location（\.html$、静态资源）抢走；
    # client_max_body_size 必须放大，否则 20MB 诊断包会被 nginx 以 413 拒绝。
    location ^~ /mrrc/support/ {
        proxy_pass http://127.0.0.1:8099/;
        client_max_body_size 25m;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    index index.html;

    # ── Performance ──
    sendfile on;
    tcp_nopush on;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── FDE → Agentic Engineering: canonical URL migrations (2026-09-02) ──
    # 整页改名，无路径变形，故用 location =（精确匹配）而非 rewrite。
    # 位置不敏感：nginx 先匹配 location =，再按「最长前缀 vs 正则」择优，
    # 精确匹配恒胜正则，下面的 location ~* \.html$ 抢不走这些请求。
    # 真正load-bearing的是发布顺序：内容站点先部署、本配置最后 reload，
    # 否则 301 会先指向还不存在的 /agentic.html，把老链接打成 404。
    location = /fde.html              { return 301 /agentic.html; }
    location = /zh/fde.html           { return 301 /zh/agentic.html; }
    location = /mrrc/fde.html         { return 301 /mrrc/agentic.html; }
    location = /mrrc/zh/fde.html      { return 301 /mrrc/zh/agentic.html; }
    location = /mrrc_modern/fde.html  { return 301 /mrrc_modern/agentic.html; }
    # (2026-09-12) /mrrc_ft710/fde.html previously redirected within the site to
    # /mrrc_ft710/agentic.html. That site is now archived and 301s wholesale to
    # /mrrc_modern/ via the ^~ location below, so the intra-site hop was dropped.

    # ── Blog merge (2026-09-06): from-intent-to-delivery 并入 seven-billion-tokens ──
    # 目录页仍是真实存在的跳转页（meta refresh 兜底），301 在 nginx 层先执行。
    location = /blog/from-intent-to-delivery/    { return 301 /blog/seven-billion-tokens/; }
    location = /blog/from-intent-to-delivery/zh/ { return 301 /blog/seven-billion-tokens/zh/; }

    # ── Static asset caching (all sub-sites) ──
    location ~* ^/(mrrc|mrrc_modern|mrrc_ft710|mrrc_ft8|sunmrrc|sunsdrmobile|efhw|yijing)/.*\.(css|js|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── HTML pages: always revalidate (never serve stale content) ──
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Landing page (root /) ──
    location / {
        try_files $uri $uri/ =404;
    }

    # ── MRRC website (/mrrc/) ──
    location /mrrc/ {
        try_files $uri $uri/ =404;
        autoindex off;
    }
    location = /mrrc {
        return 301 /mrrc/;
    }



    # ── MRRC Modern listen-only UI (/mrrc_modern/listen) ──
    # Backend: operator's radio server over public IPv6 (HTTPS :8888).
    # If the radio host's IPv6 changes, edit deploy_listen_proxy.sh and re-run.
    location = /mrrc_modern/listen {
        proxy_pass https://[2409:8a00:1894:9940:41:1df2:337d:6e4b]:8888/listen;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect /login /mrrc_modern/login;
    }
    location = /mrrc_modern/login {
        proxy_pass https://[2409:8a00:1894:9940:41:1df2:337d:6e4b]:8888/login;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
    }
    location = /mrrc_modern/listen.js {
        proxy_pass https://[2409:8a00:1894:9940:41:1df2:337d:6e4b]:8888/listen.js;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
    }
    location = /mrrc_modern/rx_worklet_processor.js {
        proxy_pass https://[2409:8a00:1894:9940:41:1df2:337d:6e4b]:8888/rx_worklet_processor.js;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
    }
    location ^~ /mrrc_modern/modules/ {
        proxy_pass https://[2409:8a00:1894:9940:41:1df2:337d:6e4b]:8888/modules/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
    }
    location ^~ /mrrc_modern/api/ {
        proxy_pass https://[2409:8a00:1894:9940:41:1df2:337d:6e4b]:8888/api/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # WebSocket channels: /WSradio, /WSspectrum, /WSaudioRX (listen role has
    # no /WSaudioTX — the radio server refuses it before nginx matters).
    # ^~ is load-bearing on this site: the regex locations (like the .js
    # static-asset rule) further up outrank a plain prefix match and would
    # serve local 404s.
    location ^~ /mrrc_modern/WS {
        rewrite ^/mrrc_modern(/WS.*)$ $1 break;
        proxy_pass https://[2409:8a00:1894:9940:41:1df2:337d:6e4b]:8888;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # ── MRRC Modern support receiver (/mrrc_modern/support/) ──
    location /mrrc_modern/support/ {
        proxy_pass http://127.0.0.1:8098/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 25m;
    }

    # ── MRRC Modern website (/mrrc_modern/) ──
    location /mrrc_modern/ {
        try_files $uri $uri/ =404;
        autoindex off;
    }
    location = /mrrc_modern {
        return 301 /mrrc_modern/;
    }

    # ── MRRC FT-710: archived 2026-09-12, merged into MRRC Modern ──
    # The repository is archived read-only; this site 301s to its successor.
    # `^~` is load-bearing, for the same reason as /stats/ above: the regex
    # location `~* \.(css|js|…)$` further up outranks a plain prefix match, so
    # /mrrc_ft710/css/octen.css would be served as a static asset (or 404) instead
    # of redirecting. `^~` skips regex matching, so the redirect always wins.
    location ^~ /mrrc_ft710/ { return 301 /mrrc_modern/; }

    # ── MRRC-FT8 website (/mrrc_ft8/) ──
    location /mrrc_ft8/ {
        try_files $uri $uri/ =404;
        autoindex off;
    }
    location = /mrrc_ft8 {
        return 301 /mrrc_ft8/;
    }

    # ── SunMRRC website (/sunmrrc/) ──
    location /sunmrrc/ {
        try_files $uri $uri/ =404;
        autoindex off;
    }

    # ── SunsdrMobile: merged 2026-09-12 into SunMRRC as its native iOS client ──
    # The app was never a standalone product — it opens the same four WebSocket
    # connections the browser does — so its page now lives at /sunmrrc/ios/.
    # `^~` is load-bearing, same reason as /stats/ and /mrrc_ft710/: the regex
    # location `~* \.(css|js|…)$` above outranks a plain prefix match, and the
    # server directory is gone, so /sunsdrmobile/css/scope.css would 404 there
    # instead of redirecting.
    location ^~ /sunsdrmobile/ { return 301 /sunmrrc/ios/; }

    # ── EFHW website (/efhw/) ──
    location /efhw/ {
        try_files $uri $uri/ =404;
        autoindex off;
    }
    location = /efhw {
        return 301 /efhw/;
    }

    # ── 易占 (/yijing/) — 易经占卜子站，纯静态 ──
    location /yijing/ {
        try_files $uri $uri/ =404;
        autoindex off;
    }
    location = /yijing {
        return 301 /yijing/;
    }

    # ── 易占 AI 解读代理 → 本机 llm_proxy（密钥只在服务器端 env）──
    # ^~ 与 MRRC support 同理：不让静态资源/\.html$ 正则抢走 API 路径。
    location ^~ /yijing/api/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Stats dashboard ──
    location = /stats { return 301 /stats/; }
    # `^~` is load-bearing: without it the regex location `~* \.html$` further up
    # outranks this prefix location (nginx: longest prefix match, then a matching
    # regex wins), so /stats/index.html — and the index-redirect that /stats/ issues
    # after a successful login — resolved against the server root instead of the
    # alias and returned 404 for a file that exists, authenticated or not.
    # Verified 2026-09-12 (error log): `open() "/var/www/vlsc.net/stats/index.html"
    # failed (2: No such file or directory)` for request `GET /stats/`.
    # `^~` skips regex matching, so the alias is kept.
    # Also never add `try_files` here: alias + try_files resolves against the root,
    # not the alias, and reintroduces the same 404 by a different route.
    location ^~ /stats/ {
        alias /home/cheenle/stats/;
        index index.html;
        auth_basic "Stats Dashboard";
        auth_basic_user_file /home/cheenle/stats/.htpasswd;
    }

    # ── Feedback system (Python service @ 127.0.0.1:8021) ──
    # `^~` for the same reason as /stats/: a regex location would otherwise win
    # and serve these paths from the DocumentRoot (404), bypassing the alias and
    # auth_basic both.
    location ^~ /feedback/static/ {
        alias /home/cheenle/feedback/static/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location /feedback/api/ {
        proxy_pass http://127.0.0.1:8021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /feedback/admin/ {
        proxy_pass http://127.0.0.1:8021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        auth_basic "Feedback Admin";
        auth_basic_user_file /home/cheenle/stats/.htpasswd;
    }

    # ── Deny hidden files ──
    location ~ /\. {
        deny all;
    }
}
