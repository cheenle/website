<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易占 · 易经占卜</title>
<meta name="description" content="据《周易》古法起卦断卦：铜钱摇卦，排本卦之卦互卦，卦辞爻辞彖象原文与白话今译。">
<link rel="stylesheet" href="css/yijing.css?v=20260926e">
</head>
<body>
<header class="site-header">
  <h1 class="seal">易占</h1>
  <p class="subtitle">究天人之际，通古今之变 —— 据《周易》经传而断</p>
</header>

<main>
  <section id="screen-ask" class="screen">
    <h2>问卦</h2>
    <p class="hint">心有所疑，默想所问之事，然后摇卦。诚则灵，渎则不告。</p>
    <textarea id="question" rows="3" maxlength="100" placeholder="所问何事？（可不填，心中默念即可）"></textarea>
    <fieldset class="categories">
      <legend>问事类别</legend>
      <label><input type="radio" name="category" value="综合" checked>综合</label>
      <label><input type="radio" name="category" value="事业">事业</label>
      <label><input type="radio" name="category" value="财运">财运</label>
      <label><input type="radio" name="category" value="感情">感情</label>
      <label><input type="radio" name="category" value="健康">健康</label>
      <label><input type="radio" name="category" value="出行">出行</label>
    </fieldset>
    <fieldset class="categories">
      <legend>起卦方式</legend>
      <label><input type="radio" name="method" value="tongqian" checked>传统铜钱六爻</label>
      <label><input type="radio" name="method" value="meihua-time">梅花·当前时间</label>
      <label><input type="radio" name="method" value="meihua-num">梅花·输入数字</label>
      <label><input type="radio" name="method" value="random">电脑随机</label>
    </fieldset>
    <div id="num-row" class="track-row hidden">
      <label for="num1">上卦数</label><input id="num1" type="number" min="1" max="999" value="5">
      <label for="num2">下卦数</label><input id="num2" type="number" min="1" max="999" value="3">
      <span class="hint">梅花以先天数除 8 取卦、除 6 取动爻</span>
    </div>
    <button id="btn-start" class="primary">净手摇卦</button>
    <button id="btn-history" class="link">查看占例记录</button>
  </section>

  <section id="screen-cast" class="screen hidden">
    <h2>摇卦</h2>
    <p id="cast-progress" class="hint"></p>
    <div id="coins" class="coins">
      <div class="coin"><div class="coin-inner"><span class="cf front">背</span><span class="cf back">字</span></div></div>
      <div class="coin"><div class="coin-inner"><span class="cf front">背</span><span class="cf back">字</span></div></div>
      <div class="coin"><div class="coin-inner"><span class="cf front">背</span><span class="cf back">字</span></div></div>
    </div>
    <p class="hint"><button id="btn-shake" class="link">开启摇一摇起卦</button>　<button id="btn-sound" class="link">音效：开</button></p>
    <div id="cast-lines" class="cast-lines"></div>
  </section>

  <section id="screen-result" class="screen hidden">
    <h2>卦成</h2>
    <div id="result-summary"></div>
    <div id="result-guas" class="guas"></div>
    <div id="result-duan"></div>
    <div class="actions">
      <button id="btn-llm" class="primary">AI 进一步解读</button>
      <button id="btn-poster" class="link">生成卦象海报</button>
      <button id="btn-again" class="link">再占一卦</button>
      <button id="btn-back" class="link">返回问卦</button>
    </div>
    <div id="llm-panel" class="llm hidden"></div>
    <div class="track-row">
      <label for="track-period">应验跟踪：</label>
      <select id="track-period">
        <option value="0">不跟踪</option>
        <option value="7">一周后回访</option>
        <option value="30">一月后回访</option>
      </select>
      <span class="hint">到期后再访问，会请你回填结果</span>
    </div>
    <div id="chat-box" class="chat hidden">
      <h3>继续追问</h3>
      <p class="hint">AI 会记住本卦上下文，可接着问。</p>
      <div id="chat-log" class="chat-log"></div>
      <div class="chat-input">
        <input id="chat-text" maxlength="200" placeholder="基于此卦继续问……">
        <button id="chat-send" class="primary">发送</button>
      </div>
    </div>
  </section>

  <div id="outcome-modal" class="modal hidden">
    <div class="modal-head"><h2>占例回访</h2></div>
    <div class="outcome-card">
      <p id="outcome-question"></p>
      <div class="outcome-btns">
        <button id="outcome-yes" class="primary">非常准</button>
        <button id="outcome-part" class="link">部分准</button>
        <button id="outcome-no" class="link">不准</button>
      </div>
      <textarea id="outcome-text" rows="3" placeholder="实际发生了什么？（选填，将作为模型训练素材）"></textarea>
      <button id="outcome-later" class="link">稍后再说</button>
    </div>
  </div>

  <div id="poster-modal" class="modal hidden">
    <div class="modal-head">
      <h2>卦象海报</h2>
      <button id="btn-poster-close" class="link">关闭</button>
    </div>
    <img id="poster-img" alt="卦象海报">
    <a id="poster-download" class="primary" download="yijing-poster.png">保存海报</a>
  </div>

  <aside id="history-panel" class="hidden">
    <div class="panel-head">
      <h2>占例记录</h2>
      <button id="btn-clear-history" class="link">清空</button>
      <button id="btn-close-history" class="link">关闭</button>
    </div>
    <ul id="history-list"></ul>
  </aside>
</main>

<footer class="site-footer">
  <p>经文据通行本《周易》；断法依朱熹《易学启蒙》。占断仅供参考，事在人为。</p>
  <p><a href="/">返回 vlsc.net 首页</a></p>
</footer>

<script src="js/data/trigrams.js?v=20260926e"></script>
<script src="js/data/hexagrams.js?v=20260926e"></script>
<script src="js/cast.js?v=20260926e"></script>
<script src="js/gua.js?v=20260926e"></script>
<script src="js/meihua.js?v=20260926e"></script>
<script src="js/app.js?v=20260926e"></script>
</body>
</html>
